spring:
  application:
    name: playcock
  datasource:
    url: ${PLAYCOCK_DB_URL:jdbc:postgresql://localhost:5432/playcock}
    username: ${PLAYCOCK_DB_USER:playcock}
    password: ${PLAYCOCK_DB_PASSWORD:playcock}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${PLAYCOCK_PORT:8080}
