spring:
  datasource:
    url: ${PLAYCOCK_LOCAL_DB_URL:jdbc:h2:file:./.local-data/playcock;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${PLAYCOCK_LOCAL_DB_USER:sa}
    password: ${PLAYCOCK_LOCAL_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: ${PLAYCOCK_PORT:8080}
